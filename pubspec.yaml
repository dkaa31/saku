name: saku
description: Aplikasi manajemen keuangan personal — catat pemasukan & pengeluaran, kelola budget kategori, dan dapatkan rekomendasi alokasi 50/30/20.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & navigasi
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  go_router: ^18.0.1

  # Database lokal (SQLite)
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  path: ^1.9.1

  # Grafik & chart
  fl_chart: ^1.2.0

  # Utilitas
  intl: ^0.20.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.6
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
